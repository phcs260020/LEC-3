<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training & Placement Cell - Student Registration</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e2f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            background: #ffffff;
            max-width: 820px;
            width: 100%;
            padding: 40px 45px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 20, 50, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ---------- Header ---------- */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #1a3a6b;
        }

        .header h1 {
            font-size: 2.2rem;
            color: #0a2540;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            color: #1a5c8a;
        }

        .header p {
            color: #475569;
            font-size: 1rem;
            margin-top: 6px;
        }

        /* ---------- Form ---------- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #dce3ed;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: #f8fafc;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1a5c8a;
            box-shadow: 0 0 0 4px rgba(26, 92, 138, 0.12);
            background: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* ---------- Department & Year inline ---------- */
        .inline-group {
            display: flex;
            gap: 18px;
        }

        .inline-group .form-group {
            flex: 1;
        }

        /* ---------- Skills (Checkboxes) ---------- */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            padding: 10px 0 5px;
        }

        .skills-grid label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
        }

        .skills-grid input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a5c8a;
            cursor: pointer;
        }

        /* ---------- Resume Upload ---------- */
        .file-upload-wrapper {
            position: relative;
        }

        .file-upload-wrapper input[type="file"] {
            padding: 14px 16px;
            background: #f1f5f9;
            border: 2px dashed #94a3b8;
            cursor: pointer;
        }

        .file-upload-wrapper input[type="file"]::file-selector-button {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            background: #1a5c8a;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-right: 12px;
            transition: background 0.3s;
        }

        .file-upload-wrapper input[type="file"]::file-selector-button:hover {
            background: #0f3b5c;
        }

        .file-hint {
            font-size: 0.82rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* ---------- Submit Button ---------- */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0a2540, #1a5c8a);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(26, 92, 138, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ---------- Footer ---------- */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #e9edf2;
            padding-top: 20px;
        }

        .footer a {
            color: #1a5c8a;
            text-decoration: none;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .inline-group {
                flex-direction: column;
                gap: 0;
            }

            .skills-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ====== HEADER ====== -->
        <div class="header">
            <h1>🎓 Training &amp; Placement <span>Cell</span></h1>
            <p>B.Tech Student Registration · Department-wise Data Collection</p>
        </div>

        <!-- ====== FORM ====== -->
        <form id="registrationForm" onsubmit="return handleSubmit(event)">

            <!-- === Full Name === -->
            <div class="form-group">
                <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" placeholder="e.g. Rahul Kumar Sharma" required>
            </div>

            <!-- === Roll Number & Email (Row) === -->
            <div class="form-row">
                <div class="form-group">
                    <label for="rollNumber">Roll Number <span class="required">*</span></label>
                    <input type="text" id="rollNumber" placeholder="e.g. 21CS1001" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="student@ncechandi.ac.in" required>
                </div>
            </div>

            <!-- === Phone & Date of Birth (Row) === -->
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="e.g. 9876543210" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>
            </div>

            <!-- === Department & Year (Inline) === -->
            <div class="inline-group">
                <div class="form-group">
                    <label for="department">Department <span class="required">*</span></label>
                    <select id="department" required>
                        <option value="">— Select Department —</option>
                        <option value="CSE">Computer Science &amp; Engineering (CSE)</option>
                        <option value="ECE">Electronics &amp; Communication (ECE)</option>
                        <option value="ME">Mechanical Engineering (ME)</option>
                        <option value="CE">Civil Engineering (CE)</option>
                        <option value="EE">Electrical Engineering (EE)</option>
                        <option value="IT">Information Technology (IT)</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">Current Year <span class="required">*</span></label>
                    <select id="year" required>
                        <option value="">— Select Year —</option>
                        <option value="1st">1st Year</option>
                        <option value="2nd">2nd Year</option>
                        <option value="3rd">3rd Year</option>
                        <option value="4th">4th Year</option>
                    </select>
                </div>
            </div>

            <!-- === CGPA === -->
            <div class="form-group">
                <label for="cgpa">CGPA (out of 10)</label>
                <input type="number" id="cgpa" step="0.01" min="0" max="10" placeholder="e.g. 8.5">
            </div>

            <!-- === Skills (Checkboxes) === -->
            <div class="form-group">
                <label>Skills / Technologies <span class="required">*</span></label>
                <div class="skills-grid">
                    <label><input type="checkbox" value="C" checked> C</label>
                    <label><input type="checkbox" value="C++"> C++</label>
                    <label><input type="checkbox" value="Java"> Java</label>
                    <label><input type="checkbox" value="Python"> Python</label>
                    <label><input type="checkbox" value="HTML/CSS"> HTML/CSS</label>
                    <label><input type="checkbox" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" value="React"> React</label>
                    <label><input type="checkbox" value="Node.js"> Node.js</label>
                    <label><input type="checkbox" value="SQL"> SQL</label>
                    <label><input type="checkbox" value="Machine Learning"> ML / AI</label>
                    <label><input type="checkbox" value="Cloud"> Cloud (AWS/Azure)</label>
                    <label><input type="checkbox" value="Other"> Other</label>
                </div>
            </div>

            <!-- === Resume Upload === -->
            <div class="form-group">
                <label for="resume">Upload Resume (PDF / DOC)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="resume" accept=".pdf,.doc,.docx">
                </div>
                <div class="file-hint">Max size: 5 MB · Accepted: PDF, DOC, DOCX</div>
            </div>

            <!-- === Additional Notes === -->
            <div class="form-group">
                <label for="notes">Additional Notes / Achievements</label>
                <textarea id="notes" placeholder="Any certifications, projects, or achievements..."></textarea>
            </div>

            <!-- === Submit Button === -->
            <button type="submit" class="btn-submit">📋 Register Now</button>

        </form>

        <!-- ====== FOOTER ====== -->
        <div class="footer">
            &copy; 2026 <a href="#">Training &amp; Placement Cell</a> · Nalanda College of Engineering, Chandi
        </div>

    </div>

    <!-- ====== JAVASCRIPT ====== -->
    <script>
        function handleSubmit(event) {
            event.preventDefault();

            // Gather form data
            const name = document.getElementById('fullName').value.trim();
            const roll = document.getElementById('rollNumber').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dob = document.getElementById('dob').value;
            const dept = document.getElementById('department').value;
            const year = document.getElementById('year').value;
            const cgpa = document.getElementById('cgpa').value;
            const notes = document.getElementById('notes').value.trim();

            // Get selected skills
            const skillCheckboxes = document.querySelectorAll('.skills-grid input[type="checkbox"]:checked');
            const skills = Array.from(skillCheckboxes).map(cb => cb.value).join(', ');

            // Resume file
            const resumeFile = document.getElementById('resume').files[0];
            const resumeName = resumeFile ? resumeFile.name : 'Not uploaded';

            // Simple validation (already handled by HTML5 required attributes)
            if (!name || !roll || !email || !phone || !dept || !year) {
                alert('⚠️ Please fill in all required fields (marked with *).');
                return false;
            }

            // Build confirmation message
            const message =
                '✅ Registration Successful!\n\n' +
                '📌 Student Details:\n' +
                '─────────────────────\n' +
                '👤 Name        : ' + name + '\n' +
                '🎓 Roll No.    : ' + roll + '\n' +
                '📧 Email       : ' + email + '\n' +
                '📞 Phone       : ' + phone + '\n' +
                '📅 DOB         : ' + (dob || 'Not provided') + '\n' +
                '🏫 Department  : ' + dept + '\n' +
                '📚 Year        : ' + year + '\n' +
                '📊 CGPA        : ' + (cgpa || 'Not provided') + '\n' +
                '🛠️ Skills      : ' + (skills || 'None selected') + '\n' +
                '📄 Resume      : ' + resumeName + '\n' +
                '📝 Notes       : ' + (notes || 'None') + '\n' +
                '─────────────────────\n' +
                'Thank you for registering!\n' +
                'The Placement Cell will contact you soon.';

            alert(message);

            // (Optional) You can send this data to a server using fetch() here.

            // Reset the form after submission
            document.getElementById('registrationForm').reset();

            return false;
        }
    </script>

</body>
</html>
